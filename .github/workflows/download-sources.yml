 # Runs sources/download_sources.py on GitHub's servers and saves the results back
# into the repo. Start it from the Actions tab: "Download Enron sources" > "Run workflow".

name: Download Enron sources

on:
  workflow_dispatch:
    inputs:
      contact:
        description: "Your name and email (sec.gov requires this; e.g. Steven Smith steven@school.edu)"
        required: true

permissions:
  contents: write   # lets the job save the downloaded files back into the repo

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get a copy of the repo
        uses: actions/checkout@v4

      - name: Download every source in the manifest
        working-directory: sources
        env:
          SEC_CONTACT: ${{ github.event.inputs.contact }}
        run: python3 download_sources.py

      - name: Save the files back into the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Download source documents (automated)"
            git push
          fi
