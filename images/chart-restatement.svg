<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Enron's restatement: how much reported net income was cut, 1997–2000</title>
  <desc id="d">Bar chart. In its quarterly report (Form 10-Q) filed November 19, 2001, Enron restated its net income for 1997 to 2000. Reductions to reported net income: 1997, 79 million dollars (from 105 million to 26 million); 1998, 139 million dollars (from 703 million to 564 million); 1999, 258 million dollars (from 893 million to 635 million); 2000, 137 million dollars (from 979 million to 842 million). The cuts came from including JEDI, Chewco and an LJM1 subsidiary in Enron's own statements, plus audit adjustments. Other figures exist: Enron's first estimate on November 8, 2001 (Form 8-K) was 96, 113, 250 and 132 million dollars. The Powers Report gives 28, 133, 248 and 99 million dollars, counting only Chewco and LJM1 and leaving out audit adjustments.</desc>
  <style>
    svg { --d-bg:#fcfcfb; --d-ink:#1b1b1a; --d-muted:#52514e; --d-line:#8a8984; --d-co:#e3eefb; --d-co-edge:#2a78d6; --d-spe:#fde8df; --d-spe-edge:#c4501f; --d-out:#eeeeec; --d-note:#f6f3e6; --d-flag:#8a3a12; --d-bar:#2a78d6; }
    @media (prefers-color-scheme: dark) {
      svg { --d-bg:#1a1a19; --d-ink:#f2f2f0; --d-muted:#c3c2b7; --d-line:#9a998f; --d-co:#1d2d42; --d-co-edge:#3987e5; --d-spe:#3d241a; --d-spe-edge:#e0703f; --d-out:#2a2a28; --d-note:#2b2920; --d-flag:#f0a47f; --d-bar:#3987e5; }
    }
    .bg   { fill: var(--diagram-bg, var(--d-bg)); }
    .ink  { fill: var(--diagram-ink, var(--d-ink)); }
    .mut  { fill: var(--diagram-muted, var(--d-muted)); }
    .co   { fill: var(--d-co); stroke: var(--d-co-edge); stroke-width: 2.5; }
    .spe  { fill: var(--d-spe); stroke: var(--d-spe-edge); stroke-width: 2.5; }
    .out  { fill: var(--d-out); stroke: var(--d-line); stroke-width: 2; }
    .note { fill: var(--d-note); stroke: var(--d-line); stroke-width: 1.5; }
    .zone { fill: none; stroke: var(--d-line); stroke-width: 2; stroke-dasharray: 8 6; }
    .flag { fill: none; stroke: var(--d-flag); stroke-width: 2; stroke-dasharray: 6 5; }
    .flagt{ fill: var(--d-flag); font-size: 13px; font-weight: 700; letter-spacing: .06em; }
    .bar  { fill: var(--d-bar); }
    .base { stroke: var(--d-line); stroke-width: 1.5; }
    .arr  { fill: none; stroke: var(--diagram-ink, var(--d-ink)); stroke-width: 3; }
    .thin { fill: none; stroke: var(--diagram-muted, var(--d-muted)); stroke-width: 2; }
    .ah   { fill: var(--diagram-ink, var(--d-ink)); }
    .ahm  { fill: var(--diagram-muted, var(--d-muted)); }
    .step { fill: var(--diagram-ink, var(--d-ink)); }
    .stepn{ fill: var(--diagram-bg, var(--d-bg)); font-weight: 700; font-size: 15px; }
    .h    { font-size: 21px; font-weight: 700; }
    .hb   { font-weight: 700; }
    .i    { font-style: italic; }
    .tag  { font-weight: 700; letter-spacing: .06em; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="ahm" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="640" rx="12"/>
  <text class="ink" x="24" y="38" font-size="21" font-weight="700">How much Enron's restatement cut reported net income</text>
  <text class="mut" x="24" y="62" font-size="14.5">Reduction per year, $ millions, as restated in Enron's Form 10-Q filed Nov. 19, 2001</text>
  <line class="base" x1="60" y1="330" x2="776" y2="330"/>
  <path class="bar" d="M110,330 V267.2 Q110,263.2 114,263.2 H202 Q206,263.2 206,267.2 V330 Z"/>
  <text class="ink" x="158.0" y="253.1538461538462" font-size="17" text-anchor="middle" font-weight="700">−$79M</text>
  <text class="ink" x="158.0" y="354" font-size="16" text-anchor="middle" font-weight="700">1997</text>
  <text class="mut" x="158.0" y="376" font-size="13" text-anchor="middle">$105M reported</text>
  <text class="mut" x="158.0" y="394" font-size="13" text-anchor="middle">$26M restated</text>
  <path class="bar" d="M280,330 V216.4 Q280,212.4 284,212.4 H372 Q376,212.4 376,216.4 V330 Z"/>
  <text class="ink" x="328.0" y="202.3846153846154" font-size="17" text-anchor="middle" font-weight="700">−$139M</text>
  <text class="ink" x="328.0" y="354" font-size="16" text-anchor="middle" font-weight="700">1998</text>
  <text class="mut" x="328.0" y="376" font-size="13" text-anchor="middle">$703M reported</text>
  <text class="mut" x="328.0" y="394" font-size="13" text-anchor="middle">$564M restated</text>
  <path class="bar" d="M450,330 V115.7 Q450,111.7 454,111.7 H542 Q546,111.7 546,115.7 V330 Z"/>
  <text class="ink" x="498.0" y="101.69230769230771" font-size="17" text-anchor="middle" font-weight="700">−$258M</text>
  <text class="ink" x="498.0" y="354" font-size="16" text-anchor="middle" font-weight="700">1999</text>
  <text class="mut" x="498.0" y="376" font-size="13" text-anchor="middle">$893M reported</text>
  <text class="mut" x="498.0" y="394" font-size="13" text-anchor="middle">$635M restated</text>
  <path class="bar" d="M620,330 V218.1 Q620,214.1 624,214.1 H712 Q716,214.1 716,218.1 V330 Z"/>
  <text class="ink" x="668.0" y="204.0769230769231" font-size="17" text-anchor="middle" font-weight="700">−$137M</text>
  <text class="ink" x="668.0" y="354" font-size="16" text-anchor="middle" font-weight="700">2000</text>
  <text class="mut" x="668.0" y="376" font-size="13" text-anchor="middle">$979M reported</text>
  <text class="mut" x="668.0" y="394" font-size="13" text-anchor="middle">$842M restated</text>
  <text class="ink" x="24" y="430" font-size="14">The cuts came from including JEDI, Chewco and an LJM1 subsidiary in Enron's own financial</text>
  <text class="ink" x="24" y="449" font-size="14">statements, plus audit adjustments.</text>
  <rect class="note" x="24" y="462" width="752" height="128" rx="10"/>
  <text class="ink" x="40" y="486" font-size="14.5" font-weight="700">Sources give different figures</text>
  <text class="ink" x="40" y="508" font-size="13.5">Enron's first estimate on Nov. 8, 2001 (Form 8-K press release) was $96M, $113M, $250M and $132M.</text>
  <text class="ink" x="40" y="526" font-size="13.5">The 10-Q calls its figures a "further refinement."</text>
  <text class="ink" x="40" y="546" font-size="13.5">The Powers Report gives $28M, $133M, $248M and $99M: it counts only Chewco and LJM1 and leaves out</text>
  <text class="ink" x="40" y="564" font-size="13.5">audit adjustments.</text>
  <text class="mut" x="24" y="624" font-size="12.5">Sources: Enron Form 10-Q, Q3 2001, Note 3, pp. 15–16; Form 8-K, Nov. 8, 2001 (Ex. 99.1), p. 3; Powers Report p. 3.</text>
</svg>
