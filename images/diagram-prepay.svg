<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">How a bank "prepay" worked: a loan dressed up as trades</title>
  <desc id="d">Original diagram, simplified, of a JPMorgan Chase prepay as described under oath by Senate subcommittee investigator Robert Roach on July 23, 2002, and as alleged by the SEC. Step 1: the bank sends cash to an offshore entity, Mahonia. Step 2: Mahonia sends the cash to Enron now, as a prepayment for commodities. Step 3: Enron makes commodity deliveries to Mahonia later. Step 4: Mahonia passes the deliveries back to the bank. Step 5: an offsetting swap between the bank and Enron sends the commodity price risk back to Enron, so the circle closes. Net effect: Enron gets cash now and repays it later with interest set in advance; the SEC alleged these prepays were in substance loans. How Enron could record it: the cash as cash flow from operations rather than borrowing (Roach testified); what it owed appeared as price risk management liabilities, minority interest, or otherwise, not as debt (SEC alleged); on its tax returns Enron treated the deals as loans (Roach testified). Senate staff estimate for the end of 2000: about 4 billion dollars of prepays outstanding; booked as debt, total debt would have risen about 40 percent to 14 billion dollars and funds flow from operations would have fallen almost 50 percent to 1.7 billion dollars. Roach testified that Enron obtained more than 8 billion dollars through prepays over about six years, including 3.7 billion from Chase; Citigroup's total is 4.8 billion per Roach and 4.7 billion per the bankruptcy examiner. JPMorgan Chase's witness testified that prepaid forwards are fundamentally different than funded debt. Who controlled Mahonia is disputed: Roach called it one of Chase's shell corporations; Chase's witness testified it was beneficially owned by a charitable trust; the bankruptcy examiner called Mahonia and Delta shell entities set up by JPMorgan Chase and Citigroup.</desc>
  <style>
    svg { --d-bg:#fcfcfb; --d-ink:#1b1b1a; --d-muted:#52514e; --d-line:#8a8984; --d-co:#e3eefb; --d-co-edge:#2a78d6; --d-spe:#fde8df; --d-spe-edge:#c4501f; --d-out:#eeeeec; --d-note:#f6f3e6; --d-flag:#8a3a12; --d-bar:#2a78d6; }
    @media (prefers-color-scheme: dark) {
      svg { --d-bg:#1a1a19; --d-ink:#f2f2f0; --d-muted:#c3c2b7; --d-line:#9a998f; --d-co:#1d2d42; --d-co-edge:#3987e5; --d-spe:#3d241a; --d-spe-edge:#e0703f; --d-out:#2a2a28; --d-note:#2b2920; --d-flag:#f0a47f; --d-bar:#3987e5; }
    }
