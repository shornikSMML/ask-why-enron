  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="ahm" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="1050" rx="12"/>
  <text class="ink" x="400" y="36" font-size="21" text-anchor="middle" font-weight="700">How a bank "prepay" worked</text>
  <text class="mut" x="400" y="58" font-size="13.5" text-anchor="middle">Simplified JPMorgan Chase example, as a Senate investigator described it under oath (July 23, 2002)</text>
  <rect class="spe" x="275" y="84" width="250" height="86" rx="10"/>
  <text class="ink" x="400" y="114" font-size="19" text-anchor="middle" font-weight="700">Offshore entity</text>
  <text class="ink" x="400" y="138" font-size="17" text-anchor="middle" font-weight="700">(Mahonia)*</text>
  <text class="mut" x="400" y="159" font-size="13.5" text-anchor="middle">a go-between</text>
  <rect class="out" x="24" y="290" width="240" height="90" rx="10"/>
  <text class="ink" x="144" y="330" font-size="19" text-anchor="middle" font-weight="700">The bank</text>
  <text class="ink" x="144" y="354" font-size="15" text-anchor="middle">(JPMorgan Chase)</text>
  <rect class="co" x="536" y="290" width="240" height="90" rx="10"/>
  <text class="ink" x="656" y="342" font-size="21" text-anchor="middle" font-weight="700">Enron</text>
  <path class="arr" d="M100,290 V106 H269" marker-end="url(#a)"/>
  <circle class="step" cx="100" cy="200" r="13"/><text class="stepn" x="100" y="205" text-anchor="middle">1</text>
  <text class="ink" x="185" y="98" font-size="14.5" text-anchor="middle" font-weight="700">Cash now</text>
  <path class="arr" d="M275,150 H175 V284" marker-end="url(#a)"/>
  <circle class="step" cx="175" cy="176" r="13"/><text class="stepn" x="175" y="181" text-anchor="middle">4</text>
  <text class="ink" x="196" y="206" font-size="13.5" font-weight="700">Deliveries</text>
  <text class="ink" x="196" y="223" font-size="13.5" font-weight="700">passed on</text>
  <text class="ink" x="196" y="240" font-size="13.5" font-weight="700">to the bank</text>
  <path class="arr" d="M525,106 H700 V284" marker-end="url(#a)"/>
  <circle class="step" cx="700" cy="200" r="13"/><text class="stepn" x="700" y="205" text-anchor="middle">2</text>
  <text class="ink" x="612" y="98" font-size="14.5" text-anchor="middle" font-weight="700">Cash now, as a</text>
  <text class="ink" x="612" y="128" font-size="14.5" text-anchor="middle" font-weight="700">“prepayment”</text>
  <path class="arr" d="M625,290 V150 H531" marker-end="url(#a)"/>
  <circle class="step" cx="625" cy="176" r="13"/><text class="stepn" x="625" y="181" text-anchor="middle">3</text>
  <text class="ink" x="604" y="206" font-size="13.5" text-anchor="end" font-weight="700">Commodity</text>
  <text class="ink" x="604" y="223" font-size="13.5" text-anchor="end" font-weight="700">deliveries</text>
  <text class="ink" x="604" y="240" font-size="13.5" text-anchor="end" font-weight="700">later</text>
  <path class="arr" d="M264,335 L530,335" marker-end="url(#a)"/>
  <circle class="step" cx="290" cy="335" r="13"/><text class="stepn" x="290" y="340" text-anchor="middle">5</text>
  <text class="ink" x="400" y="322" font-size="13.5" text-anchor="middle" font-weight="700">Offsetting swap: price</text>
  <text class="ink" x="400" y="356" font-size="13.5" text-anchor="middle" font-weight="700">risk goes back to Enron</text>
  <text class="mut" x="400" y="374" font-size="12.5" text-anchor="middle">(SEC alleged)</text>
  <rect class="note" x="24" y="398" width="752" height="80" rx="10"/>
  <text class="mut" x="400" y="420" font-size="14" text-anchor="middle" font-weight="700">Net effect, as Roach and the SEC described it:</text>
  <text class="ink" x="400" y="442" font-size="15" text-anchor="middle" font-weight="700">Enron gets cash now and repays it later, with interest set in advance.</text>
  <text class="ink" x="400" y="465" font-size="14" text-anchor="middle">The SEC alleged these prepays were “in substance loans.”</text>
  <rect class="note" x="24" y="498" width="372" height="300" rx="10"/>
  <text class="ink" x="44" y="526" font-size="16" font-weight="700">How Enron could record it</text>
  <text class="ink" x="44" y="552" font-size="14.5" font-weight="700">Cash in:</text>
  <text class="ink" x="44" y="572" font-size="14">counted as cash flow from operations, not</text>
  <text class="ink" x="44" y="591" font-size="14">as borrowing. (Roach testified)</text>
  <text class="ink" x="44" y="620" font-size="14.5" font-weight="700">What it owed:</text>
  <text class="ink" x="44" y="640" font-size="14">not shown as debt; it appeared as "price</text>
  <text class="ink" x="44" y="659" font-size="14">risk management liabilities," "minority</text>
  <text class="ink" x="44" y="678" font-size="14">interest," or otherwise. (SEC alleged)</text>
  <text class="ink" x="44" y="707" font-size="14.5" font-weight="700">Tax returns:</text>
  <text class="ink" x="44" y="727" font-size="14">the same deals were treated as loans, so</text>
  <text class="ink" x="44" y="746" font-size="14">Enron could deduct the interest. (Roach</text>
  <text class="ink" x="44" y="765" font-size="14">testified)</text>
  <rect class="note" x="404" y="498" width="372" height="300" rx="10"/>
  <text class="ink" x="420" y="526" font-size="16" font-weight="700">If booked as debt instead</text>
  <text class="mut" x="420" y="546" font-size="12.5">Senate staff estimate, end of 2000 (Roach testified)</text>
  <text class="ink" x="420" y="572" font-size="14">•</text>
  <text class="ink" x="434" y="572" font-size="14">About $4 billion of prepays outstanding</text>
  <text class="ink" x="420" y="597" font-size="14">•</text>
  <text class="ink" x="434" y="597" font-size="14">Total debt: up about 40%, to $14 billion</text>
  <text class="ink" x="420" y="622" font-size="14">•</text>
  <text class="ink" x="434" y="622" font-size="14">Funds flow from operations: down almost</text>
  <text class="ink" x="434" y="641" font-size="14">50%, to $1.7 billion</text>
  <line class="base" x1="420" y1="668" x2="756" y2="668"/>
  <text class="ink" x="420" y="690" font-size="14">Prepays over about six years: more than $8</text>
  <text class="ink" x="420" y="709" font-size="14">billion (Roach testified), including $3.7</text>
  <text class="ink" x="420" y="728" font-size="14">billion from Chase and $4.7–4.8 billion from</text>
  <text class="ink" x="420" y="747" font-size="14">Citigroup (sources differ).</text>
  <text class="ink" x="400" y="832" font-size="16" text-anchor="middle" font-weight="700" font-style="italic">“what remains is a loan to Enron”</text>
  <text class="mut" x="400" y="852" font-size="12.5" text-anchor="middle">— Robert Roach, Senate subcommittee investigator, under oath</text>
  <text class="ink" x="400" y="882" font-size="16" text-anchor="middle" font-weight="700" font-style="italic">“prepaid forwards are fundamentally different than funded debt”</text>
  <text class="mut" x="400" y="902" font-size="12.5" text-anchor="middle">— Jeffrey Dellapina, JPMorgan Chase, under oath</text>
  <text class="mut" x="24" y="936" font-size="12.5">*Who controlled Mahonia is disputed. Roach called it one of Chase's “shell corporations.” Chase's witness</text>
  <text class="mut" x="24" y="953" font-size="12.5">testified it was “beneficially owned by a charitable trust” and not controlled by Chase or Enron. The</text>
  <text class="mut" x="24" y="970" font-size="12.5">bankruptcy examiner called Mahonia and Delta (used in Citigroup's deals) “shell entities set up by JPMorgan</text>
  <text class="mut" x="24" y="987" font-size="12.5">Chase and Citigroup.”</text>
  <text class="mut" x="24" y="1010" font-size="12.5">Sources: Senate PSI hearing, July 23, 2002 (S. Hrg. 107-618, vol. 1), printed pp. 14–16, 60–62 (Roach,</text>
  <text class="mut" x="24" y="1027" font-size="12.5">Dellapina); SEC Press Release 2003-87; Batson Final Report p. 95 and App. G p. 62.</text>
</svg>
