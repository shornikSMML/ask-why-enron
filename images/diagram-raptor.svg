<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 926" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">How the Raptor "hedges" worked, 2000–2001</title>
  <desc id="d">Original diagram, simplified, based on the findings of Enron's board special committee (the Powers Report). Four special purpose entities called the Raptors (Talon, Timberwolf, Porcupine and Bobcat) were set up with LJM2 in 2000. LJM2 was a partnership managed by Enron's chief financial officer, Andrew Fastow. Step 1: Enron put in its own stock and rights to receive more of it; for Raptor I, about 537 million dollars of stock and stock contracts plus a 50 million dollar note. Step 2: LJM2 put 30 million dollars into each Raptor. Step 3: LJM2 got back 39.5 to 41 million dollars from each Raptor within six months. Step 4: the Raptors promised to cover Enron's losses on its merchant investments, stakes in other companies valued at market price each quarter. Result: in the last two quarters of 2000, Enron recognized 532 million dollars of pre-tax earnings from the Raptors, more than 80 percent of its 650 million dollars of reported pre-tax earnings. The catch: the Raptors' ability to pay rested mainly on Enron's own stock. When Enron's share price fell, they could not pay. December 22, 2000: two Raptors lacked the capacity to pay, and Enron pooled all four under a 45-day cross-guarantee and recorded no loss reserve for 2000. March 26, 2001: with a 504 million dollar shortfall, Enron restructured the Raptors, adding more than 800 million dollars of contracts to receive its own stock. September 28, 2001: Enron terminated the Raptors, paid LJM2 about 35 million dollars, and recorded a charge of about 710 million dollars before taxes. The committee found: In effect, Enron was hedging risk with itself. Raptor III (Porcupine) held warrants for New Power Company stock instead of Enron stock.</desc>
  <style>
    svg { --d-bg:#fcfcfb; --d-ink:#1b1b1a; --d-muted:#52514e; --d-line:#8a8984; --d-co:#e3eefb; --d-co-edge:#2a78d6; --d-spe:#fde8df; --d-spe-edge:#c4501f; --d-out:#eeeeec; --d-note:#f6f3e6; --d-flag:#8a3a12; --d-bar:#2a78d6; }
    @media (prefers-color-scheme: dark) {
      svg { --d-bg:#1a1a19; --d-ink:#f2f2f0; --d-muted:#c3c2b7; --d-line:#9a998f; --d-co:#1d2d42; --d-co-edge:#3987e5; --d-spe:#3d241a; --d-spe-edge:#e0703f; --d-out:#2a2a28; --d-note:#2b2920; --d-flag:#f0a47f; --d-bar:#3987e5; }
    }
    .bg   { fill: var(--diagram-bg, var(--d-bg)); }
    .ink  { fill: var(--diagram-ink, var(--d-ink)); }
    .mut  { fill: var(--diagram-muted, var(--d-muted)); }
    .co   { fill: var(--d-co); stroke: var(--d-co-edge); stroke-width: 2.5; }
    .spe  { fill: var(--d-spe); stroke: var(--d-spe-edge); stroke-width: 2.5; }
    .out  { fill: var(--d-out); stroke: var(--d-line); stroke-width: 2; }
    .note { fill: var(--d-note); stroke: var(--d-line); stroke-width: 1.5; }
    .zone { fill: none; stroke: var(--d-line); stroke-width: 2; stroke-dasharray: 8 6; }
    .flag { fill: none; stroke: var(--d-flag); stroke-width: 2; stroke-dasharray: 6 5; }
    .flagt{ fill: var(--d-flag); font-size: 13px; font-weight: 700; letter-spacing: .06em; }
    .bar  { fill: var(--d-bar); }
    .base { stroke: var(--d-line); stroke-width: 1.5; }
    .arr  { fill: none; stroke: var(--diagram-ink, var(--d-ink)); stroke-width: 3; }
    .thin { fill: none; stroke: var(--diagram-muted, var(--d-muted)); stroke-width: 2; }
    .ah   { fill: var(--diagram-ink, var(--d-ink)); }
    .ahm  { fill: var(--diagram-muted, var(--d-muted)); }
    .step { fill: var(--diagram-ink, var(--d-ink)); }
    .stepn{ fill: var(--diagram-bg, var(--d-bg)); font-weight: 700; font-size: 15px; }
    .h    { font-size: 21px; font-weight: 700; }
    .hb   { font-weight: 700; }
    .i    { font-style: italic; }
    .tag  { font-weight: 700; letter-spacing: .06em; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="ahm" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="926" rx="12"/>
  <text class="ink" x="400" y="36" font-size="21" text-anchor="middle" font-weight="700">How the Raptor "hedges" worked (2000–2001)</text>
  <text class="mut" x="400" y="58" font-size="14" text-anchor="middle">Simplified. The four Raptors: Talon (I), Timberwolf (II), Porcupine (III), Bobcat (IV).</text>
  <rect class="co" x="24" y="84" width="250" height="176" rx="10"/>
  <text class="ink" x="149" y="114" font-size="21" text-anchor="middle" font-weight="700">Enron</text>
  <text class="ink" x="149" y="142" font-size="15" text-anchor="middle">Owned stakes in other</text>
  <text class="ink" x="149" y="163" font-size="15" text-anchor="middle">companies ("merchant</text>
  <text class="ink" x="149" y="184" font-size="15" text-anchor="middle">investments"), valued at</text>
  <text class="ink" x="149" y="205" font-size="15" text-anchor="middle">market price every quarter</text>
  <rect class="spe" x="526" y="84" width="250" height="176" rx="10"/>
  <text class="ink" x="651" y="114" font-size="21" text-anchor="middle" font-weight="700">The four Raptors</text>
  <text class="ink" x="651" y="142" font-size="15" text-anchor="middle">Special purpose entities</text>
  <text class="ink" x="651" y="163" font-size="15" text-anchor="middle">set up with LJM2 in 2000</text>
  <text class="ink" x="651" y="212" font-size="15" text-anchor="middle" font-weight="700">Main asset: Enron's</text>
  <text class="ink" x="651" y="233" font-size="15" text-anchor="middle" font-weight="700">own stock*</text>
  <rect class="out" x="526" y="372" width="250" height="90" rx="10"/>
  <text class="ink" x="651" y="400" font-size="19" text-anchor="middle" font-weight="700">LJM2</text>
  <text class="ink" x="651" y="424" font-size="14" text-anchor="middle">Partnership managed by Enron's</text>
  <text class="ink" x="651" y="444" font-size="14" text-anchor="middle">CFO, Andrew Fastow</text>
  <path class="arr" d="M274,120 L520,120" marker-end="url(#a)"/>
  <circle class="step" cx="300" cy="120" r="13"/><text class="stepn" x="300" y="125" text-anchor="middle">1</text>
  <text class="ink" x="400" y="144" font-size="14" text-anchor="middle" font-weight="700">Enron stock, and rights</text>
  <text class="ink" x="400" y="162" font-size="14" text-anchor="middle" font-weight="700">to receive more of it</text>
  <text class="mut" x="400" y="180" font-size="12" text-anchor="middle">(Raptor I: about $537M + a $50M note)</text>
  <path class="arr" d="M526,232 L280,232" marker-end="url(#a)"/>
  <circle class="step" cx="500" cy="232" r="13"/><text class="stepn" x="500" y="237" text-anchor="middle">4</text>
  <text class="ink" x="400" y="216" font-size="14" text-anchor="middle" font-weight="700">Promise to cover losses</text>
  <text class="ink" x="400" y="254" font-size="14" text-anchor="middle" font-weight="700">on Enron's investments</text>
  <path class="arr" d="M552,372 L552,266" marker-end="url(#a)"/>
  <circle class="step" cx="552" cy="318" r="13"/><text class="stepn" x="552" y="323" text-anchor="middle">2</text>
  <path class="arr" d="M750,260 L750,366" marker-end="url(#a)"/>
  <circle class="step" cx="750" cy="318" r="13"/><text class="stepn" x="750" y="323" text-anchor="middle">3</text>
  <text class="ink" x="651" y="290" font-size="13.5" text-anchor="middle" font-weight="700">2: $30M into each</text>
  <text class="ink" x="651" y="318" font-size="13.5" text-anchor="middle" font-weight="700">3: $39.5–41M back</text>
  <text class="ink" x="651" y="336" font-size="13.5" text-anchor="middle">from each within</text>
  <text class="ink" x="651" y="354" font-size="13.5" text-anchor="middle">six months</text>
  <rect class="note" x="24" y="290" width="470" height="172" rx="10"/>
  <text class="ink" x="44" y="320" font-size="16" font-weight="700">What Enron could report</text>
  <text class="ink" x="44" y="348" font-size="14.5">Losses on its investments were cancelled out by</text>
  <text class="ink" x="44" y="368" font-size="14.5">"gains" on the Raptor hedges.</text>
  <text class="ink" x="44" y="396" font-size="14.5">Last two quarters of 2000: $532 million of pre-tax</text>
  <text class="ink" x="44" y="416" font-size="14.5">earnings from the Raptors, more than 80% of Enron's</text>
  <text class="ink" x="44" y="436" font-size="14.5">$650 million reported pre-tax earnings.</text>
  <rect class="note" x="24" y="486" width="752" height="420" rx="12"/>
  <text class="ink" x="44" y="516" font-size="17" font-weight="700">The catch: the protection was made mostly of Enron's own stock</text>
  <rect class="spe" x="44" y="532" width="156" height="78" rx="8"/>
  <text class="ink" x="122.0" y="567" font-size="14" text-anchor="middle" font-weight="700">Enron's share</text>
  <text class="ink" x="122.0" y="585" font-size="14" text-anchor="middle" font-weight="700">price falls</text>
  <path class="arr" d="M203,571 L224,571" marker-end="url(#a)"/>
  <rect class="spe" x="228" y="532" width="156" height="78" rx="8"/>
  <text class="ink" x="306.0" y="558" font-size="14" text-anchor="middle" font-weight="700">The Enron stock</text>
  <text class="ink" x="306.0" y="576" font-size="14" text-anchor="middle" font-weight="700">the Raptors hold</text>
  <text class="ink" x="306.0" y="594" font-size="14" text-anchor="middle" font-weight="700">is worth less</text>
  <path class="arr" d="M387,571 L408,571" marker-end="url(#a)"/>
  <rect class="spe" x="412" y="532" width="156" height="78" rx="8"/>
  <text class="ink" x="490.0" y="558" font-size="14" text-anchor="middle" font-weight="700">The Raptors can</text>
  <text class="ink" x="490.0" y="576" font-size="14" text-anchor="middle" font-weight="700">no longer cover</text>
  <text class="ink" x="490.0" y="594" font-size="14" text-anchor="middle" font-weight="700">Enron's losses</text>
  <path class="arr" d="M571,571 L592,571" marker-end="url(#a)"/>
  <rect class="co" x="596" y="532" width="156" height="78" rx="8"/>
  <text class="ink" x="674.0" y="558" font-size="14" text-anchor="middle" font-weight="700">Enron has to face</text>
  <text class="ink" x="674.0" y="576" font-size="14" text-anchor="middle" font-weight="700">the losses after</text>
  <text class="ink" x="674.0" y="594" font-size="14" text-anchor="middle" font-weight="700">all</text>
  <text class="ink" x="44" y="642" font-size="14.5" font-weight="700">Dec. 22, 2000</text>
  <text class="ink" x="180" y="642" font-size="14.5">Two Raptors lack the capacity to pay. Enron pools all four under a 45-day</text>
  <text class="ink" x="180" y="662" font-size="14.5">cross-guarantee and records no loss reserve for 2000.</text>
  <text class="ink" x="44" y="690" font-size="14.5" font-weight="700">Mar. 26, 2001</text>
  <text class="ink" x="180" y="690" font-size="14.5">The shortfall has reached $504 million. Enron "restructures" the Raptors,</text>
  <text class="ink" x="180" y="710" font-size="14.5">adding more than $800 million of contracts to receive its own stock.</text>
  <text class="ink" x="44" y="738" font-size="14.5" font-weight="700">Sept. 28, 2001</text>
  <text class="ink" x="180" y="738" font-size="14.5">Enron ends the Raptors, pays LJM2 about $35 million, and records a charge</text>
  <text class="ink" x="180" y="758" font-size="14.5">of about $710 million before taxes.</text>
  <text class="ink" x="400" y="798" font-size="17" text-anchor="middle" font-weight="700" font-style="italic">"In effect, Enron was hedging risk with itself."</text>
  <text class="mut" x="400" y="820" font-size="13.5" text-anchor="middle">— Enron board's special committee (Powers Report, p. 97)</text>
  <text class="mut" x="44" y="868" font-size="12.5">*Raptor III (Porcupine) held warrants for New Power Company stock instead of Enron stock.</text>
  <text class="mut" x="44" y="888" font-size="12.5">Sources: Powers Report pp. 14, 70–73, 97–104, 114, 119–129; Enron Form 10-Q, Q3 2001, p. 53.</text>
</svg>
