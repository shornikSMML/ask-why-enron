  <text class="ink" x="408" y="522" font-size="14">•</text>
  <text class="ink" x="422" y="522" font-size="13.5">A new board, overseen by the SEC, registers</text>
  <text class="ink" x="422" y="540" font-size="13.5">audit firms, sets auditing standards, inspects</text>
  <text class="ink" x="422" y="558" font-size="13.5">firms and disciplines them.</text>
  <text class="ink" x="408" y="582" font-size="14">•</text>
  <text class="ink" x="422" y="582" font-size="13.5">Inspections every year for firms that audit</text>
  <text class="ink" x="422" y="600" font-size="13.5">more than 100 public companies; at least every</text>
  <text class="ink" x="422" y="618" font-size="13.5">3 years for the rest.</text>
  <text class="ink" x="408" y="642" font-size="14">•</text>
  <text class="ink" x="422" y="642" font-size="13.5">Standards must require audit work papers to be</text>
  <text class="ink" x="422" y="660" font-size="13.5">kept 7 years and a second partner to review</text>
  <text class="ink" x="422" y="678" font-size="13.5">each audit report.</text>
  <text class="ink" x="408" y="702" font-size="14">•</text>
  <text class="ink" x="422" y="702" font-size="13.5">Fines up to $15 million per firm for</text>
  <text class="ink" x="422" y="720" font-size="13.5">intentional, knowing or reckless conduct, or</text>
  <text class="ink" x="422" y="738" font-size="13.5">repeated negligence.</text>
  <text class="ink" x="137" y="596.0" font-size="15" text-anchor="middle" font-weight="700">Auditors largely</text>
  <text class="ink" x="137" y="616.0" font-size="15" text-anchor="middle" font-weight="700">policed themselves,</text>
  <text class="ink" x="137" y="636.0" font-size="15" text-anchor="middle" font-weight="700">with firms reviewing</text>
  <text class="ink" x="137" y="656.0" font-size="15" text-anchor="middle" font-weight="700">one another ("peer</text>
  <text class="ink" x="137" y="676.0" font-size="15" text-anchor="middle" font-weight="700">review")</text>
  <text class="ink" x="322" y="624.0" font-size="15" text-anchor="middle" font-weight="700">§§101–109</text>
  <text class="mut" x="322" y="647.0" font-size="12.5" text-anchor="middle">The PCAOB</text>
  <path class="arr" d="M250,631.0 L265,631.0" marker-end="url(#a)"/>
  <path class="arr" d="M374,631.0 L389,631.0" marker-end="url(#a)"/>
  <rect class="spe" x="24" y="780" width="226" height="270" rx="10"/>
  <rect class="co" x="270" y="780" width="104" height="270" rx="10"/>
  <rect class="note" x="394" y="780" width="382" height="270" rx="10"/>
  <text class="ink" x="408" y="806" font-size="14">•</text>
  <text class="ink" x="422" y="806" font-size="13.5">Bans eight named kinds of non-audit services</text>
  <text class="ink" x="422" y="824" font-size="13.5">for audit clients, plus any other service the</text>
  <text class="ink" x="422" y="842" font-size="13.5">PCAOB bans by rule (§201).</text>
  <text class="ink" x="408" y="866" font-size="14">•</text>
  <text class="ink" x="422" y="866" font-size="13.5">The audit committee must approve in advance</text>
  <text class="ink" x="422" y="884" font-size="13.5">every service the auditor provides (§202).</text>
  <text class="ink" x="408" y="908" font-size="14">•</text>
  <text class="ink" x="422" y="908" font-size="13.5">Audit partners must rotate (§203). Forcing</text>
  <text class="ink" x="422" y="926" font-size="13.5">companies to change audit firms was only</text>
  <text class="ink" x="422" y="944" font-size="13.5">studied (§207).</text>
  <text class="ink" x="408" y="968" font-size="14">•</text>
  <text class="ink" x="422" y="968" font-size="13.5">One-year cooling-off: a firm may not audit a</text>
  <text class="ink" x="422" y="986" font-size="13.5">company whose CEO, CFO, controller or chief</text>
  <text class="ink" x="422" y="1004" font-size="13.5">accounting officer worked on its audit in the</text>
  <text class="ink" x="422" y="1022" font-size="13.5">year before (§206).</text>
  <text class="ink" x="137" y="890.0" font-size="15" text-anchor="middle" font-weight="700">Auditor also paid for</text>
  <text class="ink" x="137" y="910.0" font-size="15" text-anchor="middle" font-weight="700">consulting; audit-team</text>
  <text class="ink" x="137" y="930.0" font-size="15" text-anchor="middle" font-weight="700">members hired into top</text>
  <text class="ink" x="137" y="950.0" font-size="15" text-anchor="middle" font-weight="700">company jobs</text>
  <text class="ink" x="322" y="890.0" font-size="15" text-anchor="middle" font-weight="700">§§201–203,</text>
  <text class="ink" x="322" y="909.0" font-size="15" text-anchor="middle" font-weight="700">206</text>
  <text class="mut" x="322" y="932.0" font-size="12.5" text-anchor="middle">Auditor</text>
  <text class="mut" x="322" y="949.0" font-size="12.5" text-anchor="middle">independence</text>
  <path class="arr" d="M250,915.0 L265,915.0" marker-end="url(#a)"/>
  <path class="arr" d="M374,915.0 L389,915.0" marker-end="url(#a)"/>
