  <text class="ink" x="408" y="376" font-size="14">•</text>
  <text class="ink" x="422" y="376" font-size="13.5">Management assesses the company's internal</text>
  <text class="ink" x="422" y="394" font-size="13.5">controls, and the outside auditor attests to</text>
  <text class="ink" x="422" y="412" font-size="13.5">that assessment.</text>
  <text class="ink" x="408" y="436" font-size="14">•</text>
  <text class="ink" x="422" y="436" font-size="13.5">The attestation follows PCAOB standards and is</text>
  <text class="ink" x="422" y="454" font-size="13.5">part of the audit, not a separate engagement.</text>
  <text class="ink" x="137" y="391.0" font-size="15" text-anchor="middle" font-weight="700">No required yearly</text>
  <text class="ink" x="137" y="411.0" font-size="15" text-anchor="middle" font-weight="700">report on whether a</text>
  <text class="ink" x="137" y="431.0" font-size="15" text-anchor="middle" font-weight="700">company's internal</text>
  <text class="ink" x="137" y="451.0" font-size="15" text-anchor="middle" font-weight="700">controls work</text>
  <text class="ink" x="322" y="400.5" font-size="15" text-anchor="middle" font-weight="700">§404</text>
  <text class="mut" x="322" y="423.5" font-size="12.5" text-anchor="middle">Internal</text>
  <text class="mut" x="322" y="440.5" font-size="12.5" text-anchor="middle">controls</text>
  <path class="arr" d="M250,416.0 L265,416.0" marker-end="url(#a)"/>
  <path class="arr" d="M374,416.0 L389,416.0" marker-end="url(#a)"/>
