<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1475" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">From Enron's problems to the Sarbanes-Oxley Act: five parts of the 2002 law</title>
  <desc id="d">Original chart with five rows. Each row links a problem the Enron era exposed, the Sarbanes-Oxley section that responds, and what that section requires. Row 1: §§302, 906 (Certification). Problem: Growing doubt that audited financial statements could be believed. Requires: The CEO and CFO must sign a statement with each periodic report that it complies with the law and fairly presents the company's finances (§906). The signing officers answer for internal controls and must tell the auditors and audit committee about serious control weaknesses and any fraud involving management (§302). Knowingly false certification: up to 10 years in prison; willful: up to 20 years (§906). Row 2: §404 (Internal controls). Problem: No required yearly report on whether a company's internal controls work. Requires: Management assesses the company's internal controls, and the outside auditor attests to that assessment. The attestation follows PCAOB standards and is part of the audit, not a separate engagement. Row 3: §§101–109 (The PCAOB). Problem: Auditors largely policed themselves, with firms reviewing one another ("peer review"). Requires: A new board, overseen by the SEC, registers audit firms, sets auditing standards, inspects firms and disciplines them. Inspections every year for firms that audit more than 100 public companies; at least every 3 years for the rest. Standards must require audit work papers to be kept 7 years and a second partner to review each audit report. Fines up to $15 million per firm for intentional, knowing or reckless conduct, or repeated negligence. Row 4: §§201–203, 206 (Auditor independence). Problem: Auditor also paid for consulting; audit-team members hired into top company jobs. Requires: Bans eight named kinds of non-audit services for audit clients, plus any other service the PCAOB bans by rule (§201). The audit committee must approve in advance every service the auditor provides (§202). Audit partners must rotate (§203). Forcing companies to change audit firms was only studied (§207). One-year cooling-off: a firm may not audit a company whose CEO, CFO, controller or chief accounting officer worked on its audit in the year before (§206). Row 5: §§802, 806, 807, 1107 (Documents, whistleblowers, penalties). Problem: Documents destroyed; employees who raised concerns had little legal protection. Requires: Two new crimes for destroying or falsifying records; auditors must keep audit work papers 5 years (§802). An employee punished for reporting fraud can complain to the Labor Department within 90 days, then go to court; remedies include reinstatement and back pay (§806). A new securities-fraud crime with up to 25 years in prison (§807). In the Senate it had been described as a 10-year felony. Retaliating against someone who gives truthful information to law enforcement: a crime, up to 10 years (§1107). The problem column summarizes congressional reports and statements; it is not a list of findings against any person.</desc>
