  <text class="mut" x="24" y="1380" font-size="13">The problem column summarizes what congressional reports, hearing statements and senators said the Enron</text>
  <text class="mut" x="24" y="1397" font-size="13">era exposed. It is not a finding against any person or firm.</text>
  <text class="mut" x="24" y="1420" font-size="12.5">Sources: Sarbanes-Oxley Act of 2002 (Pub. L. 107-204), §§101–109, 201–207, 302, 404, 802, 806, 807, 906, 1107;</text>
  <text class="mut" x="24" y="1437" font-size="12.5">S. Rept. 107-205, pp. 5–31; H. Rept. 107-414, p. 55; S. Hrg. 107-948 (Breeden statement; Senate floor debate,</text>
  <text class="mut" x="24" y="1454" font-size="12.5">pp. 1226, 1233); SEC Section 704 report, p. 41.</text>
