  <text class="ink" x="422" y="1324" font-size="13.5">10 years (§1107).</text>
  <text class="ink" x="137" y="1183.0" font-size="15" text-anchor="middle" font-weight="700">Documents destroyed;</text>
  <text class="ink" x="137" y="1203.0" font-size="15" text-anchor="middle" font-weight="700">employees who raised</text>
  <text class="ink" x="137" y="1223.0" font-size="15" text-anchor="middle" font-weight="700">concerns had little</text>
  <text class="ink" x="137" y="1243.0" font-size="15" text-anchor="middle" font-weight="700">legal protection</text>
  <text class="ink" x="322" y="1165.0" font-size="15" text-anchor="middle" font-weight="700">§§802,</text>
  <text class="ink" x="322" y="1184.0" font-size="15" text-anchor="middle" font-weight="700">806, 807,</text>
  <text class="ink" x="322" y="1203.0" font-size="15" text-anchor="middle" font-weight="700">1107</text>
  <text class="mut" x="322" y="1226.0" font-size="12.5" text-anchor="middle">Documents,</text>
  <text class="mut" x="322" y="1243.0" font-size="12.5" text-anchor="middle">whistleblowers,</text>
  <text class="mut" x="322" y="1260.0" font-size="12.5" text-anchor="middle">penalties</text>
  <path class="arr" d="M250,1208.0 L265,1208.0" marker-end="url(#a)"/>
