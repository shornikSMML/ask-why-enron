  <text class="ink" x="422" y="1126" font-size="13.5">5 years (§802).</text>
  <text class="ink" x="408" y="1150" font-size="14">•</text>
  <text class="ink" x="422" y="1150" font-size="13.5">An employee punished for reporting fraud can</text>
  <text class="ink" x="422" y="1168" font-size="13.5">complain to the Labor Department within 90</text>
  <text class="ink" x="422" y="1186" font-size="13.5">days, then go to court; remedies include</text>
  <text class="ink" x="422" y="1204" font-size="13.5">reinstatement and back pay (§806).</text>
  <text class="ink" x="408" y="1228" font-size="14">•</text>
