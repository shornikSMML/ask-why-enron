  <rect class="bg" x="0" y="0" width="800" height="1475" rx="12"/>
  <text class="ink" x="24" y="38" font-size="21" font-weight="700">From Enron's problems to the Sarbanes-Oxley Act</text>
  <text class="mut" x="24" y="62" font-size="14">Five parts of the 2002 law: the problem, the section, and what it requires</text>
  <text class="mut tag" x="24" y="96" font-size="12.5">THE PROBLEM</text>
  <text class="mut tag" x="322" y="96" font-size="12.5" text-anchor="middle">THE LAW</text>
  <text class="mut tag" x="394" y="96" font-size="12.5">WHAT IT REQUIRES</text>
