  <text class="ink" x="422" y="1246" font-size="13.5">years in prison (§807). In the Senate it had</text>
  <text class="ink" x="422" y="1264" font-size="13.5">been described as a 10-year felony.</text>
  <text class="ink" x="408" y="1288" font-size="14">•</text>
  <text class="ink" x="422" y="1288" font-size="13.5">Retaliating against someone who gives truthful</text>
