  <rect class="co" x="270" y="108" width="104" height="228" rx="10"/>
  <rect class="note" x="394" y="108" width="382" height="228" rx="10"/>
  <text class="ink" x="408" y="134" font-size="14">•</text>
  <text class="ink" x="422" y="134" font-size="13.5">The CEO and CFO must sign a statement with</text>
  <text class="ink" x="422" y="152" font-size="13.5">each periodic report that it complies with the</text>
  <text class="ink" x="422" y="170" font-size="13.5">law and fairly presents the company's finances</text>
  <text class="ink" x="422" y="188" font-size="13.5">(§906).</text>
  <text class="ink" x="408" y="212" font-size="14">•</text>
  <text class="ink" x="422" y="212" font-size="13.5">The signing officers answer for internal</text>
  <text class="ink" x="422" y="230" font-size="13.5">controls and must tell the auditors and audit</text>
  <text class="ink" x="422" y="248" font-size="13.5">committee about serious control weaknesses and</text>
  <text class="ink" x="422" y="266" font-size="13.5">any fraud involving management (§302).</text>
  <text class="ink" x="408" y="290" font-size="14">•</text>
  <text class="ink" x="422" y="290" font-size="13.5">Knowingly false certification: up to 10 years</text>
  <text class="ink" x="422" y="308" font-size="13.5">in prison; willful: up to 20 years (§906).</text>
  <text class="ink" x="137" y="197.0" font-size="15" text-anchor="middle" font-weight="700">Growing doubt that</text>
  <text class="ink" x="137" y="217.0" font-size="15" text-anchor="middle" font-weight="700">audited financial</text>
  <text class="ink" x="137" y="237.0" font-size="15" text-anchor="middle" font-weight="700">statements could be</text>
  <text class="ink" x="137" y="257.0" font-size="15" text-anchor="middle" font-weight="700">believed</text>
  <text class="ink" x="322" y="206.5" font-size="15" text-anchor="middle" font-weight="700">§§302, 906</text>
  <text class="mut" x="322" y="229.5" font-size="12.5" text-anchor="middle"></text>
  <text class="mut" x="322" y="246.5" font-size="12.5" text-anchor="middle">Certification</text>
