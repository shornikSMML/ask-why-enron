<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">How a special purpose entity can move assets and debt off a company's balance sheet</title>
  <desc id="d">Generic illustration, not Enron-specific. Step 1: the company transfers an asset to a separate entity, the special purpose entity or SPE. Step 2: outside investors and lenders put cash into the SPE. Step 3: the SPE pays the company cash for the asset. Result: if the accounting rules treat the SPE as truly separate, the asset and the SPE's debt stay off the company's balance sheet, and the company reports cash coming in, sometimes with a gain. The catch: if the company still carries the risk, for example by guaranteeing the SPE's debt, the SPE is not really independent.</desc>
  <style>
    svg { --d-bg:#fcfcfb; --d-ink:#1b1b1a; --d-muted:#52514e; --d-line:#8a8984; --d-co:#e3eefb; --d-co-edge:#2a78d6; --d-spe:#fde8df; --d-spe-edge:#c4501f; --d-out:#eeeeec; --d-note:#f6f3e6; }
    @media (prefers-color-scheme: dark) {
      svg { --d-bg:#1a1a19; --d-ink:#f2f2f0; --d-muted:#c3c2b7; --d-line:#9a998f; --d-co:#1d2d42; --d-co-edge:#3987e5; --d-spe:#3d241a; --d-spe-edge:#e0703f; --d-out:#2a2a28; --d-note:#2b2920; }
    }
    .bg   { fill: var(--diagram-bg, var(--d-bg)); }
    .ink  { fill: var(--diagram-ink, var(--d-ink)); }
    .mut  { fill: var(--diagram-muted, var(--d-muted)); }
    .co   { fill: var(--d-co); stroke: var(--d-co-edge); stroke-width: 2.5; }
    .spe  { fill: var(--d-spe); stroke: var(--d-spe-edge); stroke-width: 2.5; }
    .out  { fill: var(--d-out); stroke: var(--d-line); stroke-width: 2; }
    .note { fill: var(--d-note); stroke: var(--d-line); stroke-width: 1.5; }
    .zone { fill: none; stroke: var(--d-line); stroke-width: 2; stroke-dasharray: 8 6; }
    .arr  { fill: none; stroke: var(--diagram-ink, var(--d-ink)); stroke-width: 3; }
    .ah   { fill: var(--diagram-ink, var(--d-ink)); }
    .step { fill: var(--diagram-ink, var(--d-ink)); }
    .stepn{ fill: var(--diagram-bg, var(--d-bg)); font-weight: 700; font-size: 16px; }
    .h    { font-size: 21px; font-weight: 700; }
    .b    { font-size: 16px; }
    .s    { font-size: 14px; }
    .tag  { font-size: 14px; font-weight: 700; letter-spacing: .06em; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="560" rx="12"/>

  <text class="ink h" x="400" y="36" text-anchor="middle">How a special purpose entity (SPE) works</text>
  <text class="mut s" x="400" y="58" text-anchor="middle">Generic illustration. Not drawn from any specific Enron deal.</text>

  <!-- zones -->
  <rect class="zone" x="24" y="80" width="330" height="300" rx="14"/>
  <text class="mut tag" x="189" y="104" text-anchor="middle">ON THE COMPANY'S BALANCE SHEET</text>
  <rect class="zone" x="446" y="80" width="330" height="300" rx="14"/>
  <text class="mut tag" x="611" y="104" text-anchor="middle">OFF THE BALANCE SHEET*</text>

  <!-- company -->
  <rect class="co" x="54" y="120" width="270" height="130" rx="10"/>
  <text class="ink h" x="189" y="152" text-anchor="middle">The company</text>
  <text class="ink b" x="189" y="182" text-anchor="middle">Owns an asset (for example,</text>
  <text class="ink b" x="189" y="204" text-anchor="middle">a power plant or a stock</text>
  <text class="ink b" x="189" y="226" text-anchor="middle">investment)</text>

  <!-- SPE -->
  <rect class="spe" x="476" y="120" width="270" height="130" rx="10"/>
  <text class="ink h" x="611" y="152" text-anchor="middle" style="font-size:19px">Special purpose entity</text>
  <text class="ink b" x="611" y="182" text-anchor="middle">A separate legal entity</text>
  <text class="ink b" x="611" y="204" text-anchor="middle">set up for one job: to hold</text>
  <text class="ink b" x="611" y="226" text-anchor="middle">the asset and its debt</text>

  <!-- outside investors -->
  <rect class="out" x="476" y="298" width="270" height="66" rx="10"/>
  <text class="ink b" x="611" y="326" text-anchor="middle" font-weight="700">Outside investors &amp; lenders</text>
  <text class="ink s" x="611" y="348" text-anchor="middle">(banks, other investors)</text>

  <!-- arrow 1: asset company -> SPE -->
  <path class="arr" d="M324,160 L470,160" marker-end="url(#a)"/>
  <circle class="step" cx="352" cy="140" r="13"/><text class="stepn" x="352" y="146" text-anchor="middle">1</text>
  <text class="ink s" x="372" y="145">Asset</text>

  <!-- arrow 3: cash SPE -> company -->
  <path class="arr" d="M476,215 L330,215" marker-end="url(#a)"/>
  <circle class="step" cx="352" cy="238" r="13"/><text class="stepn" x="352" y="244" text-anchor="middle">3</text>
  <text class="ink s" x="372" y="243">Cash</text>

  <!-- arrow 2: lenders -> SPE -->
  <path class="arr" d="M611,298 L611,256" marker-end="url(#a)"/>
  <circle class="step" cx="588" cy="276" r="13"/><text class="stepn" x="588" y="282" text-anchor="middle">2</text>
  <text class="ink s" x="626" y="272">Loans and</text>
  <text class="ink s" x="626" y="290">investment</text>

  <!-- company balance sheet effect -->
  <text class="ink b" x="54" y="286" font-weight="700">What the company can report:</text>
  <text class="ink s" x="54" y="310">+ Cash comes in (step 3)</text>
  <text class="ink s" x="54" y="332">+ Sometimes a reported gain on the sale</text>
  <text class="ink s" x="54" y="354">– The asset and the SPE's debt do not</text>
  <text class="ink s" x="68" y="372">appear on its balance sheet</text>

  <!-- the catch -->
  <rect class="note" x="24" y="400" width="752" height="140" rx="12"/>
  <text class="ink b" x="46" y="430" font-weight="700">*The key question: is the SPE really independent?</text>
  <text class="ink s" x="46" y="458">Keeping an SPE off the books is meant to be allowed only when it is truly separate, with</text>
  <text class="ink s" x="46" y="480">real outside owners who have their own money at risk. If the company still carries the</text>
  <text class="ink s" x="46" y="502">risk (for example, it promises to repay the SPE's lenders), the "sale" may not be a real</text>
  <text class="ink s" x="46" y="524">sale, and investors may not see debt the company is really responsible for.</text>
</svg>
